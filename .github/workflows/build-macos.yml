name: Build macOS DMG

on:
  workflow_dispatch:
    inputs:
      helpers_source:
        description: 'Source of the ABC helper binaries'
        type: choice
        default: source
        options: [source, abcplus, repo]
      abctools_ver:
        description: 'abctools version (abcplus cosmopolitan bundle: abcm2ps + abcmidi + abcpp + abc2prt)'
        type: string
        default: '20261023-cosmo'
      abcm2ps_ver:
        description: 'abcm2ps fossil version (tag e.g. v8.14.18, or trunk)'
        type: string
        default: 'v8.14.18'
      abcmidi_ver:
        description: 'abcMIDI version (archive date on ifdo.ca/~seymour/runabc)'
        type: string
        default: '2026.10.23'
#  push:
#    tags: ['v*']

env:
  PY_MAJOR: '3.10'
  PY_FULL: '3.10.11'
  MACOSX_DEPLOYMENT_TARGET: '11.0'

jobs:
  build:
    runs-on: macos-15   # arm64 runner
    steps:
      - uses: actions/checkout@v4

      # Rosetta is needed to run an x86_64 shell (for the x86_64 assimilation)
      - name: Install Rosetta 2
        run: /usr/sbin/softwareupdate --install-rosetta --agree-to-license || true

      - name: Install python.org universal2 framework build
        run: |
          curl -sL --fail -o /tmp/python.pkg \
            "https://www.python.org/ftp/python/${PY_FULL}/python-${PY_FULL}-macos11.pkg"
          sudo installer -pkg /tmp/python.pkg -target /
          /Library/Frameworks/Python.framework/Versions/${PY_MAJOR}/bin/python3 --version

      - name: Create venv and install Python dependencies
        env:
          ARCHFLAGS: '-arch arm64 -arch x86_64'
          _PYTHON_HOST_PLATFORM: 'macosx-11.0-universal2'
        run: |
          export PY=/Library/Frameworks/Python.framework/Versions/${PY_MAJOR}/bin/python3
          $PY -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip setuptools wheel py2app
          # wxPython has no universal2 wheel: install the other deps,
          # then stitch a universal2 wxPython from the two native wheels.
          grep -iv '^[[:space:]]*wx' requirements.txt | xargs -r python -m pip install
          chmod +x build_stitch_wxpython.sh
          ./build_stitch_wxpython.sh

      - name: Build ABC helpers from source (universal2)
        if: inputs.helpers_source == 'source'
        env:
          ABCM2PS_VER: ${{ inputs.abcm2ps_ver || 'v8.14.18' }}
          ABCMIDI_VER: ${{ inputs.abcmidi_ver || '2026.10.23' }}
        run: |
          set -euo pipefail
          brew install fossil
          mkdir -p helpers_build && cd helpers_build

          # abcm2ps: official fossil repository on chiselapp (tag or trunk)
          fossil clone https://chiselapp.com/user/moinejf/repository/abcm2ps abcm2ps.fossil
          mkdir abcm2ps && (cd abcm2ps \
            && fossil open ../abcm2ps.fossil "${ABCM2PS_VER}") \
            || { echo "ERROR: abcm2ps version ${ABCM2PS_VER} not found"; \
                 fossil tag list --repo abcm2ps.fossil | head -20; exit 1; }

          # abcMIDI: release archive from ifdo.ca (Seymour Shlien)
          curl -sL --fail -o abcmidi.zip "https://ifdo.ca/~seymour/runabc/abcMIDI-${ABCMIDI_VER}.zip"
          unzip -o abcmidi.zip >/dev/null
          ABCMIDI_DIR=$(find . -maxdepth 1 -type d -name 'abcMIDI*' | head -1)
          [ -n "$ABCMIDI_DIR" ] || { echo "ERROR: abcMIDI archive not extracted"; exit 1; }
          cd ..

          # Two-pass build then lipo (robust with any Makefile).
          # abcMIDI uses out-of-tree autoconf builds (one build dir per arch)
          # so ./configure does not conflict between the two passes.
          build_slice() { # $1=arch
            ARCH="$1"
            make -C helpers_build/abcm2ps clean >/dev/null 2>&1 || true
            make -C helpers_build/abcm2ps CC=clang CFLAGS="-arch ${ARCH} -O2"

            ABCMIDI_SRC="helpers_build/${ABCMIDI_DIR}"
            mkdir -p "helpers_build/abcmidi_${ARCH}"
            (cd "helpers_build/abcmidi_${ARCH}" \
              && "${GITHUB_WORKSPACE}/${ABCMIDI_SRC}/configure" CFLAGS="-arch ${ARCH} -O2" \
              && make abc2midi abc2abc midi2abc)

            mkdir -p "helpers_build/out_${ARCH}"
            cp helpers_build/abcm2ps/abcm2ps \
               "helpers_build/abcmidi_${ARCH}/abc2abc" \
               "helpers_build/abcmidi_${ARCH}/abc2midi" \
               "helpers_build/abcmidi_${ARCH}/midi2abc" \
               "helpers_build/out_${ARCH}/"
            file "helpers_build/out_${ARCH}"/*
          }
          build_slice arm64
          build_slice x86_64

          mkdir -p bin_universal
          for b in abcm2ps abc2abc abc2midi midi2abc; do
            lipo -create "helpers_build/out_arm64/$b" "helpers_build/out_x86_64/$b" -output "bin_universal/$b"
          done
          # nwc2xml: x86_64 only, copied as-is (mono-slice in the universal DMG)
          [ -f bin/mac_x86_64/nwc2xml ] && cp bin/mac_x86_64/nwc2xml bin_universal/ \
            && echo "nwc2xml: included (x86_64 slice only)"

          echo "Quality check:"
          file bin_universal/*
          lipo -info bin_universal/*
          # Smoke test: run each helper (arm64 natively on this runner)
          for b in abcm2ps abc2abc abc2midi midi2abc; do
            arch -arm64 "bin_universal/$b" -V >/dev/null 2>&1 \
              && echo "$b [run test]: OK" \
              || echo "WARNING: $b failed the arm64 run test" >&2
          done

      # NOTE: the --assimilate flag of the abcplus cosmopolitan binaries does
      # NOT work on Apple Silicon (the ape-m1 loader passes the flag to the
      # program instead of intercepting it; verified 2026-10). Kept for the
      # x86_64-only slice / future cosmocc fixes. Prefer helpers_source: source.
      # so the binary must be INTERPRETED BY A SHELL (ENOEXEC fallback), not
      # exec'd directly. On arm64 macOS the ape-m1 loader intercepts a direct
      # exec and passes the flag to the program (which rejects it). Hence the
      # explicit `sh -c`. The header assimilates to the arch of the shell that
      # runs it: native sh -> arm64, sh under Rosetta (arch -x86_64) -> x86_64.
      - name: Fuse universal helpers from repo binaries
        if: inputs.helpers_source == 'repo'
        run: |
          set -euo pipefail
          mkdir -p bin_universal
          for b in abcm2ps abc2abc abc2midi midi2abc; do
            lipo -create "bin/mac_arm64/$b" "bin/mac_x86_64/$b" -output "bin_universal/$b"
          done
          [ -f bin/mac_x86_64/nwc2xml ] && cp bin/mac_x86_64/nwc2xml bin_universal/
          file bin_universal/*
          lipo -info bin_universal/*

      - name: Fetch abcplus cosmopolitan helpers, assimilate and fuse
        if: inputs.helpers_source == 'abcplus'
        env:
          ABCTOOLS_VER: ${{ inputs.abctools_ver || '20261023-cosmo' }}
        run: |
          set -euo pipefail
          mkdir -p helpers_src
          # Single bundle with all binaries: abcm2ps, abc2abc, abc2midi, midi2abc
          # (unzips into a versioned subfolder, e.g. abctools-20261023/)
          curl -sL --fail -o abctools.zip \
            "https://sourceforge.net/projects/abcplus/files/Abctools/abctools-${ABCTOOLS_VER}.zip/download"
          unzip -o abctools.zip -d helpers_src >/dev/null

          assimilate_slice() { # $1=binary  $2=shell prefix ("" | "arch -x86_64")  $3=dest dir
            src=$(find helpers_src -name "$1" -type f | head -1)
            [ -n "$src" ] || { echo "ERROR: $1 not found in abcplus archive" >&2; exit 1; }
            mkdir -p "$3"
            cp "$src" "$3/$1"
            chmod +x "$3/$1"
            # Force shell interpretation so the APE header handles --assimilate
            (cd "$3" && $2 sh -c "./$1 --assimilate") || true
            file "$3/$1"
            file "$3/$1" | grep -q "Mach-O" \
              || { echo "ERROR: $1 not assimilated to Mach-O (slice $3)" >&2; exit 1; }
          }

          for b in abcm2ps abc2abc abc2midi midi2abc; do assimilate_slice "$b" ""              bin/mac_arm64;   done
          for b in abcm2ps abc2abc abc2midi midi2abc; do assimilate_slice "$b" "arch -x86_64"  bin/mac_x86_64; done

          mkdir -p bin_universal
          for b in abcm2ps abc2abc abc2midi midi2abc; do
            lipo -create "bin/mac_arm64/$b" "bin/mac_x86_64/$b" -output "bin_universal/$b"
          done
          # nwc2xml: x86_64 only, copied as-is (mono-slice in the universal DMG)
          [ -f bin/mac_x86_64/nwc2xml ] && cp bin/mac_x86_64/nwc2xml bin_universal/ \
            && echo "nwc2xml: included (x86_64 slice only)"

          echo "Quality check:"
          file bin_universal/*
          lipo -info bin_universal/*
          # Smoke test: run each helper (arm64 natively on this runner)
          for b in abcm2ps abc2abc abc2midi midi2abc; do
            arch -arm64 "bin_universal/$b" -V >/dev/null 2>&1 \
              && echo "$b [run test]: OK" \
              || echo "WARNING: $b failed the arm64 run test" >&2
          done

      - name: Build app bundle
        env:
          ARCHFLAGS: '-arch arm64 -arch x86_64'
          _PYTHON_HOST_PLATFORM: 'macosx-11.0-universal2'
          HELPER_DIR: bin_universal
        run: |
          source venv/bin/activate
          chmod +x build_mac_app.sh build_make_dmg.sh
          ./build_mac_app.sh universal2

      - name: Create DMG
        run: |
          brew install create-dmg
          VERSION=$(grep "^program_version[[:space:]]*=" easyabc_version.py | sed -E "s/.*'([^']+)'.*/\1/")
          ./build_make_dmg.sh "dist/EasyABC_${VERSION}_universal2.dmg"
          hdiutil imageinfo "dist/EasyABC_${VERSION}_universal2.dmg" | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: EasyABC-universal2-DMG
          path: dist/*.dmg
          if-no-files-found: error

  release:
    if: github.event_name != 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg